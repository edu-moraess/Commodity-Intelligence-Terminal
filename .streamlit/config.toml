[theme]
base = "dark"
primaryColor = "#3fb1ce"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#141822"
textColor = "#e6e8ee"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true