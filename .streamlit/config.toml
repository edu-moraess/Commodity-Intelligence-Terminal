[theme]
base = "dark"
primaryColor = "#c9a227"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#131317"
textColor = "#e8e8ea"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true